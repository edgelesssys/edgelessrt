name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/edgelesssys/edgelessrt-dev:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: edgelessrt
          submodules: recursive

      - name: Setup
        run: mkdir build

      - name: Build
        run: |
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo ../edgelessrt
          ninja
        working-directory: build

      - name: Test
        run: |
          OE_SIMULATION=1 ctest --output-on-failure -E tests/ert/sem
        working-directory: build

      - name: CPack
        run: cpack -G DEB
        working-directory: build

      - name: Build artifact
        uses: actions/upload-artifact@v7
        with:
          name: edgelessrt
          path: build/*.deb
